version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - revive
    - unused
    - bodyclose
    - sqlclosecheck
    - contextcheck
    - errorlint
  exclusions:
    paths:
      - internal/db/sqlc
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - internal/db/sqlc
